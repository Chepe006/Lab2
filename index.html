<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio 2 - Eventos JavaScript - UGB</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <img src="https://www.google.com/url?sa=t&source=web&rct=j&url=https%3A%2F%2Fmooc.ugb.edu.sv%2Fpages%2Fcontacto.php&ved=0CBYQjRxqFwoTCKj2msPA4ZIDFQAAAAAdAAAAABAe&opi=89978449" alt="Universidad Gerardo Barrios" class="logo">
        <h1>Laboratorio 2 - Primer Cómputo<br>Semana 5</h1>
    </header>

    <div class="grid-container">
        <div class="evento" id="e1" tabindex="0">1. Click (cambia color)</div>
        <div class="evento" id="e2">2. Mouse over (aumenta tamaño)</div>
        <div class="evento" id="e3">3. Mouse out (restaura tamaño)</div>
        <div class="evento" id="e4" tabindex="0">4. Doble click (cambia texto)</div>
        
        <div class="evento" id="e5"><input type="text" placeholder="Escribe → oninput"></div>
        <div class="evento" id="e6"><input type="text" placeholder="Enfoca → onfocus"></div>
        <div class="evento" id="e7"><input type="text" placeholder="Desenfoca → onblur"></div>
        
        <div class="evento" id="e8" tabindex="0">8. Presiona tecla (keydown)</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
